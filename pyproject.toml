# numpy is a runtime dependency only. The binding is ctypes and compiles
# against no Python or numpy headers, so listing numpy here would make every
# build environment install it from source wherever no wheel exists.
[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "walkforward"
description = "Volatility forecasts, position sizing and purged walk-forward splits that never see the future"
readme = "python/README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haegan McGarry" }]
keywords = [
    "walk-forward", "purged-cross-validation", "backtesting", "lookahead-bias",
    "volatility", "garch", "position-sizing", "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]
dynamic = ["version"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.1"]
test = ["pytest>=7", "scikit-learn>=1.1", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/haeganm/walkforward"
Source = "https://github.com/haeganm/walkforward"
Issues = "https://github.com/haeganm/walkforward/issues"
Changelog = "https://github.com/haeganm/walkforward/blob/main/CHANGELOG.md"

# The packaging lives at the repository root so that a source distribution
# carries the C library it has to compile. python/CMakeLists.txt reaches back
# here for src/ and include/, which works the same in a checkout and in an
# unpacked sdist.
[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.21"
cmake.source-dir = "python"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/src/walkforward"]
# The binding is ctypes and never touches the Python C API, so one wheel per
# platform serves every Python 3 that can import it
wheel.py-api = "py3"
# The sdist carries what the root CMakeLists.txt builds as a top-level
# project (library, tests, example, bench), so `cmake -S . -B build` works on
# an unpacked sdist as well as on a checkout. The notebook and its data stay
# out; they are documentation.
sdist.include = [
    "src/*.c",
    "include/mlrisk/*.h",
    "include/mlrisk/version.h.in",
    "CMakeLists.txt",
    "cmake/*",
    "tests/*.c",
    "tests/*.h",
    "examples/vol_target_demo.c",
    "bench/bench.c",
    "python/CMakeLists.txt",
    "python/README.md",
    "python/tests/*.py",
    "LICENSE",
]
sdist.exclude = [
    ".github", ".gitattributes", ".gitignore", "python/.gitignore",
    "build", "build-*", "examples/data", "examples/*.ipynb", "examples/*.png", "tests/reference",
]

# The version comes from the root CMakeLists, the same place the C reads it
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(mlrisk VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

# The wheel is py3-none (ctypes, no Python C API), so one build per platform
# serves every interpreter. Building on a single CPython and letting the tag
# do the rest avoids five identical wheels per platform.
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "pp*"]
build-frontend = "build"
test-extras = ["test"]
# cibuildwheel runs this from a temporary directory against the installed
# wheel, so it proves the wheel carries its own shared library
test-command = "python -m pytest {project}/python/tests -q"

# manylinux_2_28 rather than the older default: numpy stopped publishing
# glibc 2.17 wheels, and numpy is a runtime dependency, so a 2.17 wheel would
# be installable only where the package could not actually run
[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }

# 64-bit only: the runtime dependencies have no 32-bit Windows wheels, so a
# win32 wheel could not be tested or installed
[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
