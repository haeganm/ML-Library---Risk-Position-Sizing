[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=1.23"]
build-backend = "scikit_build_core.build"

[project]
name = "walkforward"
description = "Volatility forecasts, position sizing and purged walk-forward splits that never see the future"
readme = "python/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Haegan McGarry" }]
keywords = [
    "walk-forward", "purged-cross-validation", "backtesting", "lookahead-bias",
    "volatility", "garch", "position-sizing", "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23"]
dynamic = ["version"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.1"]
test = ["pytest>=7", "scikit-learn>=1.1", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/haeganm/walkforward"
Changelog = "https://github.com/haeganm/walkforward/blob/main/CHANGELOG.md"

# The packaging lives at the repository root so that a source distribution
# carries the C library it has to compile. python/CMakeLists.txt reaches back
# here for src/ and include/, which works the same in a checkout and in an
# unpacked sdist.
[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
cmake.source-dir = "python"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/src/walkforward"]
# The binding is ctypes and never touches the Python C API, so one wheel per
# platform serves every Python 3 that can import it
wheel.py-api = "py3"
sdist.include = [
    "src/*.c",
    "include/mlrisk/*.h",
    "include/mlrisk/version.h.in",
    "CMakeLists.txt",
    "python/CMakeLists.txt",
    "python/README.md",
    "python/tests/*.py",
    "LICENSE",
]
sdist.exclude = [".github", "build", "build-*", "bench", "examples", "tests/reference"]

# The version comes from the root CMakeLists, the same place the C reads it
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(mlrisk VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

# The wheel is py3-none (ctypes, no Python C API), so one build per platform
# serves every interpreter. Building on a single CPython and letting the tag
# do the rest avoids five identical wheels per platform.
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "pp*"]
build-frontend = "build"
test-extras = ["test"]
# cibuildwheel runs this from a temporary directory against the installed
# wheel, so it proves the wheel carries its own shared library
test-command = "python -m pytest {project}/python/tests -q"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
